<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D62828" />
      <stop offset="100%" stop-color="#9B111E" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="20" fill="#0B0B0C" stroke="#27272A" stroke-width="3" />
  
  <!-- Chef Hat / CodeChef Icon -->
  <g transform="translate(18, 16)">
    <!-- Base band -->
    <rect x="14" y="46" width="36" height="10" rx="2" fill="#FFFFFF" />
    <!-- Hat Puffs -->
    <path d="M18 46 C12 36, 12 24, 24 22 C26 12, 38 12, 40 22 C52 24, 52 36, 46 46 Z" fill="url(#hatGrad)" />
    <!-- Monospace code bracket accent inside hat band -->
    <path d="M26 50 L22 51 L26 52" stroke="#D62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M38 50 L42 51 L38 52" stroke="#D62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="32" cy="51" r="1.2" fill="#0B0B0C" />
  </g>
</svg>
